<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento de Marcenaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#EEF0EC;
    --paper:#FBFBF9;
    --ink:#1D221F;
    --muted:#5E6660;
    --line:#D6DAD3;
    --band:#E3E7E0;
    --accent:#7A4E26;
    --accent-ink:#FFFFFF;
    --accent-soft:#F1E6DA;
    --danger:#A3372B;
    --focus:#2F6FB0;
    --display:"Bricolage Grotesque", "Archivo", system-ui, sans-serif;
    --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#161A18; --paper:#1E2320; --ink:#E7EAE5; --muted:#9AA39C;
      --line:#333A35; --band:#262C28; --accent:#D39A62; --accent-ink:#1A120A;
      --accent-soft:#3A2B1E; --danger:#E0786B; --focus:#7FB2E8;
    }
  }
  :root[data-theme="dark"]{
    --ground:#161A18; --paper:#1E2320; --ink:#E7EAE5; --muted:#9AA39C;
    --line:#333A35; --band:#262C28; --accent:#D39A62; --accent-ink:#1A120A;
    --accent-soft:#3A2B1E; --danger:#E0786B; --focus:#7FB2E8;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
  .wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
  .actions{display:flex;flex-wrap:wrap;gap:8px}

  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:500}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
  button.ghost:hover{color:var(--danger);border-color:transparent}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px}

  label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input[type=text],input[type=date],input:not([type]){font:inherit;font-family:var(--body);font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
  select{font:inherit;font-family:var(--body);font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 30px 8px 10px;width:100%;min-width:0;cursor:pointer;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .amb-field{display:flex;flex-direction:column;gap:6px}
  .amb-field > label.f{gap:0}
  select:focus,input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent)}

  .add{display:grid;grid-template-columns:1.1fr 2fr .9fr auto;gap:10px;align-items:end;padding:14px;background:var(--band);border-radius:8px}
  .add .money{font-family:var(--mono);text-align:right}
  .add-title{grid-column:1/-1;font-family:var(--display);font-weight:500;font-size:15px;margin:0}

  .table-wrap{overflow-x:auto}
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
  thead th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 8px 8px;border-bottom:2px solid var(--ink)}
  thead th.num{text-align:right}
  col.c-desc{width:auto}
  col.c-val{width:170px}
  col.c-act{width:40px}

  tr.group td{padding:18px 8px 8px;border-bottom:1px solid var(--line)}
  .gname{display:flex;align-items:center;gap:10px}
  .gname input{font-family:var(--display);font-weight:700;font-size:18px;border-color:transparent;background:transparent;padding:4px 6px;margin-left:-6px;max-width:320px}
  .gname input:hover{border-color:var(--line)}
  .gcount{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .gadd{font-size:13px;padding:4px 10px;color:var(--accent);border-color:transparent;background:transparent;white-space:nowrap}
  .gadd:hover{border-color:var(--accent)}

  tr.item td{padding:2px 8px;border-bottom:1px dashed var(--line);vertical-align:middle}
  tr.item input{border-color:transparent;background:transparent;padding:7px 6px;margin-left:-6px}
  tr.item input:hover{border-color:var(--line)}
  tr.item input.money{font-family:var(--mono);text-align:right;margin-left:0}
  tr.item .del{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1}

  tr.sub td{padding:8px 8px 4px;font-family:var(--mono);font-size:13px}
  tr.sub .lbl{color:var(--muted);text-align:right}
  tr.sub .v{text-align:right;font-weight:600;background:var(--accent-soft);border-radius:4px;padding-inline:8px}

  .total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid var(--ink);padding-top:14px}
  .breakdown{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .breakdown b{color:var(--ink);font-weight:500}
  .grand{display:flex;align-items:baseline;gap:12px}
  .grand span{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .grand strong{font-family:var(--display);font-size:clamp(26px,5vw,34px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}

  .notes textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:64px;resize:vertical;text-transform:none;letter-spacing:0;font-family:var(--body)}
  .empty{padding:28px 8px;text-align:center;color:var(--muted)}
  .hint{font-size:12.5px;color:var(--muted);margin:0}
  .print-only{display:none}

  @media (max-width:640px){
    .add{grid-template-columns:1fr}
    col.c-val{width:112px}
    col.c-act{width:34px}
    .gcount{display:none}
    tr.sub .lbl{font-size:12px}
    .gname input{font-size:16px}
    .sheet{padding:14px}
  }

  @media print{
    @page{size:A4;margin:16mm 14mm}
    :root{--ground:#fff;--paper:#fff;--ink:#111;--muted:#555;--line:#ccc;--band:#fff;--accent:#6B4220;--accent-soft:#F1E6DA}
    body{background:#fff;font-size:12px}
    .wrap{padding:0;max-width:none;gap:14px}
    .no-print,.actions,.add,.del,.gadd,.hint,col.c-act,td.act,th.act{display:none!important}
    .print-only{display:block}
    .sheet{border:none;padding:0;border-radius:0}
    input,textarea{border:none!important;box-shadow:none!important;padding:0!important;margin:0!important;background:transparent!important;resize:none}
    tr.item td{padding:5px 8px}
    tr.group{break-after:avoid}
    tr.item,tr.sub{break-inside:avoid}
    .gname input{font-size:15px}
    .grand strong{font-size:24px}
    .notes textarea{min-height:0;height:auto}
    .notes.blank{display:none}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Orçamentos de fornecedores</p>
      <h1>Orçamento de Marcenaria</h1>
    </div>
    <div class="actions">
      <button type="button" id="btn-clear">Novo orçamento</button>
      <button type="button" class="primary" id="btn-pdf">Exportar PDF</button>
    </div>
  </header>

  <section class="sheet">
    <form class="add no-print" id="add-form" autocomplete="off">
      <p class="add-title">Adicionar item</p>
      <div class="f amb-field">
        <label class="f" for="a-sel">Ambiente</label>
        <select id="a-sel" aria-label="Escolher ambiente"></select>
        <input id="a-amb" type="text" placeholder="Nome do novo ambiente" aria-label="Novo ambiente" hidden>
      </div>
      <label class="f f-desc">Descrição do item<input id="a-desc" type="text" placeholder="Ex.: Armário aéreo em MDF branco 18 mm" required></label>
      <label class="f">Valor (R$)<input id="a-val" type="text" inputmode="decimal" class="money" placeholder="0,00" required></label>
      <button type="submit" class="primary">Adicionar</button>
    </form>

    <div class="table-wrap">
      <table>
        <colgroup><col class="c-desc"><col class="c-val"><col class="c-act"></colgroup>
        <thead><tr><th>Ambiente / descrição dos itens</th><th class="num">Valor</th><th class="act"></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="total">
      <div class="breakdown" id="breakdown"></div>
      <div class="grand"><span>Total geral</span><strong id="grand">R$ 0,00</strong></div>
    </div>

    <label class="f notes" id="notes-wrap">Observações<textarea id="m-obs" placeholder="Condições negociadas, prazo, forma de pagamento…"></textarea></label>
  </section>

  <p class="hint">Os dados ficam salvos neste navegador. Clique no nome de um ambiente, descrição ou valor para editar. “Exportar PDF” abre a impressão — escolha “Salvar como PDF”.</p>
</div>

<script>
(function(){
  const KEY = 'orcamento-marcenaria-v1';
  const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  const num = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const $ = id => document.getElementById(id);
  let uid = 1;

  const sample = () => ({
    meta:{obs:''},
    items:[
      {amb:'Cozinha',desc:'Armários inferiores em MDF branco TX 18 mm com corrediças telescópicas',val:6850},
      {amb:'Cozinha',desc:'Armários aéreos com portas basculantes e pistão a gás',val:4200},
      {amb:'Cozinha',desc:'Torre quente para forno e micro-ondas',val:2900},
      {amb:'Dormitório casal',desc:'Guarda-roupa 3 portas de correr em MDF freijó',val:9400},
      {amb:'Dormitório casal',desc:'Cabeceira ripada com nichos e iluminação LED',val:3150},
      {amb:'Banheiro social',desc:'Gabinete suspenso com 2 gavetas, MDF naval',val:1980}
    ]
  });

  let state;
  try{ state = JSON.parse(localStorage.getItem(KEY)); }catch(e){ state = null; }
  if(!state || !Array.isArray(state.items)) state = sample();
  state.items.forEach(it => it.id = uid++);

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({meta:state.meta,items:state.items.map(({amb,desc,val})=>({amb,desc,val}))})); }catch(e){} }

  function parseMoney(s){
    s = String(s).replace(/[R$\s]/g,'');
    if(!s) return 0;
    if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
    const n = parseFloat(s);
    return isFinite(n) ? Math.round(n*100)/100 : 0;
  }
  const norm = s => s.trim().replace(/\s+/g,' ');
  const key = s => norm(s).toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // "cozinha" x "cosinha": distância de edição entre nomes sem acento
  function dist(a,b){
    const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
    for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
    return prev[n];
  }
  function similar(name){
    const k=key(name), soft=x=>x.replace(/ss|z|ç/g,'s');
    let best=null, bd=Infinity;
    groups().forEach(g=>{ const d=Math.min(dist(k,key(g.name)),dist(soft(k),soft(key(g.name)))); if(d<bd){bd=d;best=g.name;} });
    const lim = k.length>=5 ? 2 : 1;
    return bd<=lim ? best : null;
  }
  const NEW='__novo__';
  let currentAmb = null;
  function renderSel(){
    const sel=$('a-sel'), names=groups().map(g=>g.name);
    if(currentAmb!==NEW && !names.some(n=>key(n)===key(currentAmb||''))) currentAmb = names.length ? names[names.length-1] : NEW;
    if(currentAmb!==NEW) currentAmb = names.find(n=>key(n)===key(currentAmb));
    sel.innerHTML = names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('') + `<option value="${NEW}">+ Novo ambiente…</option>`;
    sel.value = currentAmb;
    sel.hidden = !names.length;
    $('a-amb').hidden = currentAmb!==NEW;
  }

  function groups(){
    const map = new Map();
    state.items.forEach(it => {
      const k = key(it.amb);
      if(!map.has(k)) map.set(k,{name:norm(it.amb),items:[],sum:0});
      const g = map.get(k); g.items.push(it); g.sum += it.val;
    });
    return [...map.values()];
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render(){
    const gs = groups();
    const tb = $('tbody');
    if(!gs.length){
      tb.innerHTML = '<tr><td colspan="3" class="empty">Nenhum item ainda. Adicione o primeiro item acima.</td></tr>';
    } else {
      tb.innerHTML = gs.map((g,gi) => `
        <tr class="group"><td colspan="3"><div class="gname">
          <input type="text" id="g-${gi}" value="${esc(g.name)}" data-group="${esc(g.name)}" aria-label="Nome do ambiente">
          <span class="gcount">${g.items.length} ${g.items.length===1?'item':'itens'}</span>
          <button type="button" class="gadd" data-addto="${esc(g.name)}">+ item</button>
        </div></td></tr>
        ${g.items.map(it => `
          <tr class="item">
            <td><input type="text" id="d-${it.id}" value="${esc(it.desc)}" data-id="${it.id}" data-field="desc" aria-label="Descrição"></td>
            <td><input type="text" id="v-${it.id}" inputmode="decimal" class="money" value="${num.format(it.val)}" data-id="${it.id}" data-field="val" aria-label="Valor"></td>
            <td class="act"><button type="button" class="ghost del" data-del="${it.id}" aria-label="Remover item">×</button></td>
          </tr>`).join('')}
        <tr class="sub"><td class="lbl">Subtotal ${esc(g.name)}</td><td class="v">${brl.format(g.sum)}</td><td class="act"></td></tr>
      `).join('');
    }
    const total = gs.reduce((a,g)=>a+g.sum,0);
    $('grand').textContent = brl.format(total);
    $('breakdown').innerHTML = gs.map(g=>`<span>${esc(g.name)} <b>${brl.format(g.sum)}</b></span>`).join('');
    renderSel();
    save();
  }

  // meta fields
  const metaMap = {obs:'m-obs'};
  if(!state.meta) state.meta = {};
  Object.entries(metaMap).forEach(([k,id]) => {
    const el = $(id);
    el.value = state.meta?.[k] || '';
    el.addEventListener('input', () => { state.meta[k] = el.value; save(); syncNotes(); });
  });
  function syncNotes(){ $('notes-wrap').classList.toggle('blank', !$('m-obs').value.trim()); }
  syncNotes();

  // add
  $('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const isNew = $('a-sel').value===NEW || $('a-sel').hidden;
    let amb = norm(isNew ? $('a-amb').value : $('a-sel').value);
    const desc = norm($('a-desc').value);
    if(!amb){ $('a-amb').focus(); return; }
    if(!desc){ $('a-desc').focus(); return; }
    if(isNew){
      const same = groups().find(g => key(g.name) === key(amb));
      if(same) amb = same.name;
      else {
        const near = similar(amb);
        if(near && confirm(`Já existe o ambiente "${near}".\n\nOK = lançar em "${near}"\nCancelar = criar "${amb}" como novo ambiente`)) amb = near;
      }
    }
    state.items.push({id:uid++, amb, desc, val:parseMoney($('a-val').value)});
    currentAmb = amb;
    $('a-amb').value = '';
    render();
    $('a-desc').value = ''; $('a-val').value = '';
    $('a-desc').focus();
  });
  $('a-sel').addEventListener('change', e => {
    currentAmb = e.target.value;
    $('a-amb').hidden = currentAmb!==NEW;
    (currentAmb===NEW ? $('a-amb') : $('a-desc')).focus();
  });
  $('a-val').addEventListener('blur', e => { if(e.target.value.trim()) e.target.value = num.format(parseMoney(e.target.value)); });

  // inline edits
  $('tbody').addEventListener('change', e => {
    const t = e.target;
    if(t.dataset.group !== undefined){
      const nv = norm(t.value);
      if(!nv){ t.value = t.dataset.group; return; }
      state.items.forEach(it => { if(key(it.amb) === key(t.dataset.group)) it.amb = nv; });
      render(); return;
    }
    const it = state.items.find(i => i.id == t.dataset.id);
    if(!it) return;
    if(t.dataset.field === 'val') it.val = parseMoney(t.value);
    else it.desc = t.value;
    render();
  });
  $('tbody').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });
  $('tbody').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if(del){ state.items = state.items.filter(i => i.id != del.dataset.del); render(); return; }
    const add = e.target.closest('[data-addto]');
    if(add){ currentAmb = add.dataset.addto; renderSel(); $('a-desc').focus(); $('add-form').scrollIntoView({behavior:'smooth',block:'center'}); }
  });

  $('btn-clear').addEventListener('click', () => {
    if(!confirm('Começar um orçamento novo? Os itens atuais serão apagados.')) return;
    state = {meta:{},items:[]};
    Object.entries(metaMap).forEach(([k,id]) => $(id).value = state.meta[k] || '');
    syncNotes(); render();
  });

  $('btn-pdf').addEventListener('click', () => {
    const old = document.title;
    document.title = 'Orçamento marcenaria ' + new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
    const ta = $('m-obs'); ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    try{ window.print(); } catch(e){ alert('A impressão foi bloqueada aqui. Abra o arquivo HTML direto no navegador e use Ctrl/Cmd+P → Salvar como PDF.'); }
    setTimeout(() => { document.title = old; ta.style.height = ''; }, 500);
  });

  render();
})();
</script>
</body>
</html>
